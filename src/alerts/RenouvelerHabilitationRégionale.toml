type = "info"
description = "Partenaires dont l'habilitation régionale expire dans les 6 prochains mois."
message = "L'habilitation régionale expire bientôt. ({3, date, dd/mm/yyyy})"
formula = '''
=LET(
  dbHeaders; ACStructures!$1:$1;
  dbRows;    ACStructures!$2:$1000;

  outputHeaders; { "ID du Contact" \ "Nom" \ "Oui - Date de fin de l'habilitation" };
  outputIndexes; BYCOL(outputHeaders; LAMBDA(colName; MATCH(colName; dbHeaders; 0)));

  minDate; TODAY();
  maxDate; EDATE(TODAY(); 6);

  typeCol;    INDEX(dbRows; 0; MATCH("Type de structure"; dbHeaders; 0));
  dateCol;    INDEX(dbRows; 0; MATCH("Oui - Date de fin de l'habilitation"; dbHeaders; 0));
  networkCol; INDEX(dbRows; 0; MATCH("Appartient-il à un grand réseau ayant une habilitation nationale ?"; dbHeaders; 0));
  statusCol;  INDEX(dbRows; 0; MATCH("Statut"; dbHeaders; 0));

  outputRows; FILTER(
    CHOOSECOLS(dbRows; outputIndexes);
    ISNUMBER(FIND("1_Partenaire"; typeCol));
    dateCol >= minDate;
    dateCol <= maxDate;
    (networkCol = "1- NON") + (networkCol = "");
    statusCol <> "CCAS/CIAS"
  );

  VSTACK(outputHeaders; outputRows)
)
'''
js = '''
((() =>
{
	// Between now and ~6 months from now
	const minDate = Date.now();
	const maxDate = minDate + (6 * 30 * 24 * 60 * 60);

	return (row) =>
	{
		const network = row['Appartient-il à un grand réseau ayant une habilitation nationale ?'];
		const date = +row["Oui - Date de fin de l'habilitation"];

		// Is a CCAS/CIAS
		const isCCAS = (row['Statut'] === 'CCAS/CIAS');

		// Is part of a network that has a national accrediation
		const isInNetwork = (network !== '') && (network !== '1- NON');

		// 'Type de structure' contains '1_Partenaire'
		// 'Appartient-il à un grand réseau ayant une habilitation nationale ?' is NOT 'Croix Rouge'
		// 'Date de la dernière signature de la convention / du contrat' is between than 4.5 and 5 years ago
		return row['Type de structure'].includes('1_Partenaire')
			&& (date >= +minDate)
			&& (date <= +maxDate)
			&& !isCCAS
			&& !isInNetwork;
	};
})())
'''
