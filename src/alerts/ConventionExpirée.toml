type = "issue"
description = "Partenaires dont la convention est antérieure à 5 ans. Sont exclus les partenaires du réseau Croix Rouge."
message = "La dernière signature de la convention est antérieure à 5 ans. ({3, date, dd/mm/yyyy})"
formula = '''
=LET(
  dbHeaders; ACStructures!$1:$1;
  dbRows;    ACStructures!$2:$1000;

  outputHeaders; { "ID du Contact" \ "Nom" \ "Date de la dernière signature de la convention / du contrat" };
  outputIndexes; BYCOL(outputHeaders; LAMBDA(colName; MATCH(colName; dbHeaders; 0)));

  cutoffDate; EDATE(TODAY(); -60);

  typeCol;    INDEX(dbRows; 0; MATCH("Type de structure"; dbHeaders; 0));
  dateCol;    INDEX(dbRows; 0; MATCH("Date de la dernière signature de la convention / du contrat"; dbHeaders; 0));
  networkCol; INDEX(dbRows; 0; MATCH("Appartient-il à un grand réseau ayant une habilitation nationale ?"; dbHeaders; 0));

  outputRows; FILTER(
    CHOOSECOLS(dbRows; outputIndexes);
    ISNUMBER(FIND("1_Partenaire"; typeCol));
    networkCol <> "Croix Rouge";
    dateCol <= cutoffDate
  );

  VSTACK(outputHeaders; outputRows)
)
'''
js = '''
((() =>
{
	const cutoffDate = new Date;
	cutoffDate.setFullYear(cutoffDate.getFullYear() - 5);

	return (row) =>
	{
		// 'Type de structure' contains '1_Partenaire'
		// 'Appartient-il à un grand réseau ayant une habilitation nationale ?' is NOT 'Croix Rouge'
		// 'Date de la dernière signature de la convention / du contrat' is older than 5 years ago
		return row['Type de structure'].includes('1_Partenaire')
			&& (row['Appartient-il à un grand réseau ayant une habilitation nationale ?'] !== 'Croix Rouge')
			&& (row['Date de la signature initiale de la convention / du contrat'] < cutoffDate);
	};
})())
'''
