type = "issue"
description = "Partenaires qui ne possèdent pas d'habilitation valide. Sont exclus : CCAS/CIAS, membres d'un réseau ayant une habilitation nationale, partenaires ayant une habilitation régionale valide."
message = "Absence d'habilitation valide."
formula = '''
=LET(
  dbHeaders; ACStructures!$1:$1;
  dbRows;    ACStructures!$2:$1000;

  outputHeaders; { "ID du Contact" \ "Nom" };
  outputIndexes; BYCOL(outputHeaders; LAMBDA(colName; MATCH(colName; dbHeaders; 0)));

  cutoffDate; TODAY();

  typeCol;    INDEX(dbRows; 0; MATCH("Type de structure"; dbHeaders; 0));
  dateCol;    INDEX(dbRows; 0; MATCH("Oui - Date de fin de l'habilitation"; dbHeaders; 0));
  networkCol; INDEX(dbRows; 0; MATCH("Appartient-il à un grand réseau ayant une habilitation nationale ?"; dbHeaders; 0));
  regionCol;  INDEX(dbRows; 0; MATCH("Si non, a-t-il une habilitation régionale ?"; dbHeaders; 0));
  statusCol;  INDEX(dbRows; 0; MATCH("Statut"; dbHeaders; 0));

  isCCAS;      ARRAYFORMULA(statusCol = "CCAS/CIAS");
  hasRegion;   ARRAYFORMULA((regionCol = "Oui") * (dateCol > cutoffDate));
  isInNetwork; ARRAYFORMULA((networkCol <> "") * (networkCol <> "1- NON"));

  outputRows; FILTER(
    CHOOSECOLS(dbRows; outputIndexes);
    ISNUMBER(FIND("1_Partenaire"; typeCol));
    NOT(isCCAS + hasRegion + isInNetwork)
  );

  VSTACK(outputHeaders; outputRows)
)
'''
js = '''
((() =>
{
	const now = Date.now();

	return (row) =>
	{
		const network = row['Appartient-il à un grand réseau ayant une habilitation nationale ?'];

		// Is a CCAS/CIAS
		const isCCAS = (row['Statut'] === 'CCAS/CIAS');

		// Regional accreditation is valid and in the future
		const hasRegion = (+row["Oui - Date de fin de l'habilitation"] > now);

		// Is part of a network that has a national accrediation
		const isInNetwork = (network !== '') && (network !== '1- NON');

		// 'Type de structure' contains '1_Partenaire'
		// Not a 'CCAS/CIAS', no regional accreditation and no national network
		return row['Type de structure'].includes('1_Partenaire')
			&& !isCCAS && !hasRegion && !isInNetwork;
	};
})())
'''
